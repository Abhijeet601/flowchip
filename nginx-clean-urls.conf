# Nginx clean URL configuration for a static HTML site
server {
  listen 80;
  server_name your-domain.com;
  root /path/to/your/site/root;

  location / {
    # Serve files directly when they exist
    try_files $uri $uri/ $uri.html /home.html;
  }

  # Redirect .html requests to clean URLs
  location ~ ^/(.+)\.html$ {
    return 301 /$1;
  }

  # Optional: serve static assets normally
  location /assets/ {
    try_files $uri =404;
  }
}
